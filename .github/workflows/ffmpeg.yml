# Builds the LGPL ffmpeg the Windows and macOS apps ship from pinned upstream
# tarballs, smoke-tests every command shape the app runs on each OS, and stages
# the binaries with their exact sources in one draft release for a maintainer
# to publish. Pushes that touch the build trigger it as well as the Actions tab,
# so a branch can run it before the file reaches master. See
# docs/development.md#ffmpeg-is-our-own-lgpl-build.
name: ffmpeg

on:
  push:
    paths:
      - app/scripts/ffmpeg/**
      - .github/workflows/ffmpeg.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: ubuntu-latest
          - target: macos-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the MinGW-w64 cross toolchain
        if: matrix.target == 'windows-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64 nasm meson ninja-build pkg-config gnupg
      - name: Install the build tools
        if: matrix.target == 'macos-arm64'
        run: brew install meson ninja pkgconf gnupg
      - name: Build
        env:
          FFMPEG_WORK_DIR: ${{ runner.temp }}/ffmpeg-work
        run: app/scripts/ffmpeg/build.sh ${{ matrix.target }} "$RUNNER_TEMP/ffmpeg-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target }}
          if-no-files-found: error
          path: ${{ runner.temp }}/ffmpeg-${{ matrix.target }}
      - name: Retain the build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target }}-logs
          path: |
            ${{ runner.temp }}/ffmpeg-work/${{ matrix.target }}/build/*.log
            ${{ runner.temp }}/ffmpeg-work/${{ matrix.target }}/build/ffmpeg/ffbuild/config.log
            ${{ runner.temp }}/ffmpeg-work/${{ matrix.target }}/build/ffmpeg/*.out
            ${{ runner.temp }}/ffmpeg-work/${{ matrix.target }}/build/ffmpeg/*.log

  fixtures:
    name: Smoke-test fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install a full ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - run: app/scripts/ffmpeg/fixtures.sh "$RUNNER_TEMP/fixtures"
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-fixtures
          if-no-files-found: error
          path: ${{ runner.temp }}/fixtures

  smoke:
    name: Smoke test (${{ matrix.target }})
    needs: [build, fixtures]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-latest
            binary: ffmpeg-windows-x64.exe
          - target: macos-arm64
            os: macos-latest
            binary: ffmpeg-macos-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target }}
          path: build
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-fixtures
          path: fixtures
      # Artifacts lose the execute bit.
      - name: Run every command shape the app uses
        run: |
          chmod +x build/${{ matrix.binary }}
          app/scripts/ffmpeg/smoke.sh build/${{ matrix.binary }} fixtures report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ffmpeg-${{ matrix.target }}-smoke
          path: report

  draft-release:
    name: Stage the draft release
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-*-x64
          path: builds
      - uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-*-arm64
          path: builds
      - uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-*-smoke
          path: smoke
      # Only a draft is ever created or replaced. Once a maintainer publishes
      # the release its assets are fixed: changing the build means raising
      # OCULUS_BUILD in build.sh, which names a new tag.
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Each build carries the same source tarballs and build files; the
          # per-target files (configure, config.log, toolchain) are named by
          # target already.
          mkdir assets
          for f in builds/*/*; do [ -e "assets/$(basename "$f")" ] || cp "$f" assets/; done
          tag=$(cat assets/release-tag.txt)
          rm assets/release-tag.txt assets/SHA256SUMS
          for dir in smoke/ffmpeg-*-smoke; do
            target=${dir#smoke/ffmpeg-}; target=${target%-smoke}
            for f in buildconf license version; do cp "$dir/$f.txt" "assets/$f-$target.txt"; done
          done
          (cd assets && sha256sum * > SHA256SUMS)
          {
            echo "FFmpeg for Oculus on Windows x64 and macOS arm64, built from commit $GITHUB_SHA by run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
            echo
            echo "\`ffmpeg-windows-x64.exe\` and \`ffmpeg-macos-arm64\` are FFmpeg under the GNU LGPL version 3 or later, statically linked with libopus (BSD-3-Clause) and dav1d (BSD-2-Clause); the Mac build also uses Apple's VideoToolbox, the Windows one Windows' Media Foundation."
            echo "This release is their complete corresponding source: the unmodified upstream tarballs, the build script \`build.sh\` with \`configure-flags.txt\`, the full configure lines, \`config.log\` files and the toolchain versions."
            echo "Rebuild with \`build.sh <target> <out-dir>\` (\`windows-x64\` on Ubuntu, \`macos-arm64\` on an Apple Silicon Mac) with the packages listed in \`toolchain-<target>.txt\`."
            echo
            echo '```'
            cat assets/SHA256SUMS
            echo '```'
          } > notes.md
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::$tag is already published; raise OCULUS_BUILD in app/scripts/ffmpeg/build.sh to stage a new build"
              exit 1
            fi
            gh release edit "$tag" --draft --target "$GITHUB_SHA" --notes-file notes.md
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
          fi
          gh release upload "$tag" assets/* --clobber
          {
            echo "Draft release $tag staged:"
            for f in assets/ffmpeg-windows-x64.exe assets/ffmpeg-macos-arm64; do
              echo "- $(basename "$f") $(sha256sum "$f" | cut -d' ' -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

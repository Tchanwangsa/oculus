# Builds the desktop bundle with tauri-action and attaches it to a draft GitHub
# release tagged from the app version (v<version>). Run by hand from the
# Actions tab after bumping the version. See
# docs/development.md#ci-proves-a-fresh-checkout-builds-releases-are-cut-by-hand.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: Bundle (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            args: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      SCCACHE_GHA_ENABLED: "true"
      # Ad-hoc signature and hardened runtime (tauri.conf.json
      # sets the same; this variable is what a Developer ID certificate would
      # override). The bundle runs, but macOS quarantines a downloaded copy
      # until `xattr -dr com.apple.quarantine` clears it. A Developer ID
      # certificate and notarisation replace this.
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: app/package.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # scripts/build-math.mjs (in `bun run build`) needs the CLI at
      # math-core/Cargo.lock's wasm-bindgen.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          cache-targets: false

      - name: Install frontend dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      # beforeBuildCommand fetches and builds the native sidecars, builds the
      # maths wasm and stages oculus-keyd's signed helper app (the release
      # policy) and the CLI; tauri signs every sidecar with the bundle and seals
      # the helper as it is.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tauriScript: bun tauri
          args: ${{ matrix.args }}
          tagName: v__VERSION__
          releaseName: Oculus v__VERSION__
          releaseCommitish: ${{ github.sha }}
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: true
          uploadWorkflowArtifacts: true

  windows:
    name: Bundle (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      distribution_ready: ${{ steps.distribution.outputs.distribution_ready }}
      version: ${{ steps.build.outputs.appVersion }}
    env:
      CARGO_TERM_COLOR: always
      SCCACHE_GHA_ENABLED: "true"
      OCULUS_WINDOWS_DISTRIBUTION_APPROVED: ${{ vars.OCULUS_WINDOWS_DISTRIBUTION_APPROVED }}
      OCULUS_MSIX_IDENTITY_NAME: ${{ vars.OCULUS_MSIX_IDENTITY_NAME }}
      OCULUS_MSIX_PUBLISHER: ${{ vars.OCULUS_MSIX_PUBLISHER }}
      OCULUS_MSIX_DISPLAY_NAME: ${{ vars.OCULUS_MSIX_DISPLAY_NAME }}
      OCULUS_MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.OCULUS_MSIX_PUBLISHER_DISPLAY_NAME }}
      OCULUS_MSIX_VERSION: ${{ vars.OCULUS_MSIX_VERSION }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: app/package.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri -> target
            app/keyd -> target
          cache-targets: false
      - name: Install frontend dependencies
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Prepare Windows distribution notices
        id: distribution
        working-directory: app
        run: bun scripts/package-msix.mjs --prepare-release
      # No release identity is passed: installer workflow artifacts always
      # exist for VM testing, independently of the public-distribution gate.
      - name: Build the Windows NSIS installer
        id: build
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: app
          tauriScript: bun tauri
          args: --config src-tauri/target/windows-release.conf.json -- --locked
      - name: Validate the renamed GUI, sidecars and NSIS installer
        working-directory: app
        run: bun scripts/package-msix.mjs --check-release
      - name: Retain the Windows installer and distribution notices
        uses: actions/upload-artifact@v4
        with:
          name: oculus-windows-x64
          if-no-files-found: error
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/windows/distribution/FFMPEG-*.txt
      - name: Check real Partner Center configuration
        id: store
        working-directory: app
        run: bun scripts/package-msix.mjs --check
      - name: Package the unsigned Store-upload MSIX
        if: steps.store.outputs.msix_enabled == 'true'
        working-directory: app
        run: bun scripts/package-msix.mjs
      - name: Retain the Store-upload MSIX
        if: steps.store.outputs.msix_enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: oculus-store-x64
          if-no-files-found: error
          path: app/src-tauri/target/release/bundle/msix/*.msix

  attach-windows:
    name: Attach approved Windows distribution to the draft release
    needs: [bundle, windows]
    if: needs.windows.outputs.distribution_ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: oculus-windows-x64
          path: windows-artifacts
      - name: Attach the installer and its ffmpeg notices and source offer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ needs.windows.outputs.version }}
        run: |
          find windows-artifacts -type f -print0 | xargs -0 gh release upload "v$APP_VERSION" --clobber

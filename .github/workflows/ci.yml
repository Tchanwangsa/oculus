# Quick checks run on every change; native jobs run for their build inputs.
# Installer packaging lives in release.yml. See docs/development.md.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed build inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.filter.outputs.native }}
      keyd: ${{ steps.filter.outputs.keyd }}
      editor: ${{ steps.filter.outputs.editor }}
      studio: ${{ steps.filter.outputs.studio }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # On master, compare all commits in this push; PRs use their base.
          base: ${{ github.ref }}
          filters: |
            native:
              - 'app/src-tauri/**'
              - 'app/keyd/**'
              - 'app/studio-core/**'
              - 'app/math-core/**'
              - 'app/canvas-core/**'
              - 'app/scripts/**'
              - 'app/package.json'
              - 'app/bun.lock'
              - 'app/patches/**'
              - '**/.cargo/**'
              - '**/rust-toolchain*'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - 'docs/cli-reference.md'
            keyd:
              - 'app/keyd/**'
              - '**/.cargo/**'
              - '**/rust-toolchain*'
              - '.github/workflows/ci.yml'
            editor:
              - 'app/editor-core/**'
              - 'app/src/**'
              - 'app/package.json'
              - 'app/bun.lock'
              - 'app/patches/**'
              - 'app/scripts/build-editor-wasm.mjs'
              - '**/.cargo/**'
              - '**/rust-toolchain*'
              - '.github/workflows/ci.yml'
            studio:
              - 'app/studio-core/**'
              - 'app/math-core/katex/**'
              - '**/.cargo/**'
              - '**/rust-toolchain*'
              - '.github/workflows/ci.yml'

  frontend:
    name: Frontend and portable Rust (Linux)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: app/package.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/math-core -> target
            app/canvas-core -> target
      - name: Rust is formatted
        run: |
          (cd src-tauri && cargo fmt --check)
          (cd keyd && cargo fmt --check)
          (cd keyd/core && cargo fmt --check)
          if [ -d canvas-core ]; then (cd canvas-core && cargo fmt --check); fi
          # The vendored katex/ keeps upstream's formatting.
          (cd math-core && cargo fmt --check -p oculus-math -p oculus-math-edit -p oracle)
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Frontend and script tests
        run: bun run test
      - name: Type-check and bundle the frontend
        run: bun run build
      # Native release-profile tests embed this same frontend through Tauri.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.native == 'true'
        with:
          name: frontend-dist
          path: app/dist
          if-no-files-found: error
          retention-days: 1
      - name: Portable Rust clippy
        run: |
          if [ -d canvas-core ]; then
            (cd canvas-core && cargo clippy --locked --all-targets -- -D warnings)
            (cd canvas-core && cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings)
          fi
          (cd math-core && cargo clippy --locked --all-targets --no-deps -p oculus-math -p oculus-math-edit -p oracle -- -D warnings)
          (cd math-core && cargo clippy --locked --no-deps -p oculus-math --target wasm32-unknown-unknown -- -D warnings)
      - name: Canvas engine tests
        if: hashFiles('app/canvas-core/Cargo.toml') != ''
        working-directory: app/canvas-core
        run: cargo test --locked
      - name: Maths engine tests
        working-directory: app/math-core
        run: cargo test --locked

  check:
    name: Check (macOS)
    needs: [changes, frontend]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.native == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      CARGO_TERM_COLOR: always
      # app/src-tauri/.cargo/config.toml names sccache as rustc's wrapper, so
      # every cargo call fails without it on PATH.
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: app/package.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          # sccache already caches compiled crates; a multi-GB target/ would
          # crowd the repo's cache quota.
          cache-targets: false

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: app/dist

      - name: Fetch ffmpeg, build the speech helper and whisper-cli
        run: bun run ffmpeg && bun run speech && bun run whisper
      # keyd's helper app, built for real: the release policy, signed and
      # verified, as the bundle would carry it.
      - name: Build, sign and stage oculus-keyd
        run: bun run stage-keyd
      # tauri-build refuses to compile anything until every externalBin exists;
      # stage-cli is what bootstraps the oculus sidecar on a fresh checkout.
      - name: Build and stage the oculus CLI
        run: bun run stage-cli
      - name: Clippy
        working-directory: app
        run: |
          (cd src-tauri && cargo clippy --release --locked --all-targets -- -D warnings)
          (cd keyd/core && cargo clippy --locked --all-targets --all-features -- -D warnings)
          (cd keyd && cargo clippy --locked --all-targets -- -D warnings)
          (cd keyd && cargo clippy --locked --all-targets --features dev -- -D warnings)
      - name: Rust tests
        working-directory: app/src-tauri
        run: cargo test --release --locked
      - name: keyd core tests
        working-directory: app/keyd/core
        run: cargo test --locked --all-features
      - name: keyd tests, release policy and dev
        working-directory: app/keyd
        run: cargo test --locked && cargo test --locked --features dev
      - name: CLI reference matches the binary
        run: |
          bun run docs:cli --staged
          git diff --exit-code -- ../docs/cli-reference.md

  windows:
    name: Check (Windows x64)
    needs: [changes, frontend]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.native == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    # Write is what lets the token see draft releases; the Windows ffmpeg
    # release stays a draft until its source offer is approved.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    env:
      CARGO_TERM_COLOR: always
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: app/package.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri -> target
            app/keyd -> target
            app/keyd/core -> target
          cache-targets: false
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: app/dist
      # fetch-ffmpeg.mjs downloads anonymously, which a draft release refuses.
      # gh fetches the asset with the job's token; the script then checks its
      # SHA-256 and keeps it.
      - name: Fetch Windows ffmpeg
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$(grep -o 'releases/download/ffmpeg-[^/"]*' scripts/fetch-ffmpeg.mjs | head -1 | cut -d/ -f3)
          mkdir -p src-tauri/binaries
          gh release download "$tag" --pattern ffmpeg-windows-x64.exe \
            --output src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe --clobber
          bun run ffmpeg
      - name: Build and stage the Windows credential broker
        run: bun run stage-keyd
      - name: Build and stage the oculus CLI
        run: bun run stage-cli
      - name: Rust tests
        working-directory: app/src-tauri
        run: cargo test --release --locked
      - name: keyd core tests
        working-directory: app/keyd/core
        run: cargo test --locked --all-features
      - name: keyd tests with the release policy
        working-directory: app/keyd
        run: cargo test --locked
      - name: keyd tests with dev admission
        working-directory: app/keyd
        run: cargo test --locked --features dev

  # keyd's core and keyd itself on a target with no adapter: the build
  # proves no OS call has leaked out of app/keyd/core/src/platform/, and
  # core's tests run there over the in-memory endpoint.
  keyd-linux:
    name: keyd seams (Linux)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.keyd == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/keyd -> target
            app/keyd/core -> target
      - name: Check and test keyd core
        working-directory: app/keyd/core
        run: cargo test --locked --all-features
      # keyd's own tests (tests/serve_local/) bind a real endpoint through the
      # OS adapter, which `unsupported` refuses; macOS and Windows run them.
      - name: Check keyd
        working-directory: app/keyd
        run: cargo check --locked

  editor-core:
    name: Editor core (Linux)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.editor == 'true'
    runs-on: ubuntu-latest
    # An uncached run also compiles the wasm-bindgen CLI.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app/editor-core
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: app/package.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      # Caches ~/.cargo/bin too, so the wasm-bindgen CLI installs once.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/editor-core -> target

      - name: Rust is formatted
        run: cargo fmt --all --check
      - name: Clippy, oracle binary and wasm bridge included
        run: |
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo clippy --locked -p oculus-editor-core-wasm --target wasm32-unknown-unknown -- -D warnings
      - name: Unit, property and spec tests
        run: cargo test --locked --workspace
      # The glue generator must be the version wasm/Cargo.toml pins.
      - name: Install the wasm-bindgen CLI
        run: |
          version=$(sed -n 's/^wasm-bindgen = "=\(.*\)"$/\1/p' wasm/Cargo.toml)
          if [ "$(wasm-bindgen --version 2>/dev/null)" != "wasm-bindgen $version" ]; then
            cargo install wasm-bindgen-cli --version "$version" --locked
          fi

      # The oracles import the app's own CodeMirror, Lezer and noteLanguage.
      - name: Install frontend dependencies
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Build the editor core's wasm
        working-directory: app
        run: bun run editor-wasm
      # A new seed each run widens coverage; a failure prints the seed to replay.
      - name: Oracles agree with CodeMirror and Lezer
        working-directory: app
        env:
          SEED: ${{ github.run_number }}
        run: |
          bun editor-core/oracle/text.ts 2000 "$SEED"
          bun editor-core/oracle/changes.ts 5000 "$SEED"
          bun editor-core/oracle/history.ts 1000 "$SEED"
          bun editor-core/oracle/markdown.ts 5000 "$SEED"
          bun editor-core/oracle/shadow.ts 300 "$SEED"

  # Studio's renderer on its own: the golden frames in tests/golden/ were
  # rendered on Apple Silicon, so this runs on macOS like the app's job.
  studio-core:
    name: Studio core (macOS)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.studio == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app/studio-core
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/studio-core -> target

      - name: Rust is formatted
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit, error, determinism and golden-frame tests
        run: cargo test --locked

  ci:
    name: CI passes
    if: always()
    needs: [changes, frontend, check, windows, keyd-linux, editor-core, studio-core]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All selected checks passed
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          if [[ "$RESULTS" == *failure* || "$RESULTS" == *cancelled* ]]; then
            echo "A required check failed or was cancelled: $RESULTS"
            exit 1
          fi

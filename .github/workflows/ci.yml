# Checks every push to master and every pull request on a fresh macOS checkout:
# that the Rust is formatted, the frontend tests and bundle, the Rust tests
# (the app's, keyd's, keyd core's and the maths engine's), that keyd builds and
# signs as the bundle ships it, and that the generated CLI reference matches the
# binary; and on Linux, that keyd builds with no OS adapter and the editor core
# agrees with CodeMirror and Lezer, natively and as the dev build's shadow mode
# runs it. See
# docs/development.md#ci-proves-a-fresh-checkout-builds-releases-are-cut-by-hand.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      CARGO_TERM_COLOR: always
      # app/src-tauri/.cargo/config.toml names sccache as rustc's wrapper, so
      # every cargo call fails without it on PATH.
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: app/package.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown
      # scripts/build-math.mjs needs the CLI at math-core/Cargo.lock's wasm-bindgen.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          # sccache already caches compiled crates; a multi-GB target/ would
          # crowd the repo's cache quota.
          cache-targets: false

      - name: Rust is formatted
        working-directory: app
        run: |
          (cd src-tauri && cargo fmt --check)
          (cd keyd && cargo fmt --check)
          (cd keyd/core && cargo fmt --check)
          # Only our crates: the vendored katex/ keeps upstream's formatting.
          (cd math-core && cargo fmt --check -p oculus-math -p oracle)

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Frontend and script tests
        run: bun run test
      - name: Type-check and bundle the frontend
        run: bun run build

      - name: Fetch ffmpeg, build the speech helper and whisper-cli
        run: bun run ffmpeg && bun run speech && bun run whisper
      # keyd's helper app, built for real: the release policy, signed and
      # verified, as the bundle would carry it.
      - name: Build, sign and stage oculus-keyd
        run: bun run stage-keyd
      # tauri-build refuses to compile anything until every externalBin exists;
      # stage-cli is what bootstraps the oculus sidecar on a fresh checkout.
      - name: Build and stage the oculus CLI
        run: bun run stage-cli
      - name: Rust tests
        working-directory: app/src-tauri
        run: cargo test --release --locked
      - name: keyd core tests
        working-directory: app/keyd/core
        run: cargo test --locked --all-features
      - name: keyd tests, release policy and dev
        working-directory: app/keyd
        run: cargo test --locked && cargo test --locked --features dev
      - name: Maths engine tests
        working-directory: app/math-core
        run: cargo test --locked

      - name: CLI reference matches the binary
        run: |
          bun run docs:cli
          git diff --exit-code -- ../docs/cli-reference.md

  # keyd's core and keyd itself on a target with no adapter: the build
  # proves no OS call has leaked out of app/keyd/core/src/platform/, and
  # core's tests run there over the in-memory endpoint.
  keyd-linux:
    name: keyd seams (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check and test keyd core
        working-directory: app/keyd/core
        run: cargo check --locked --all-features && cargo test --locked --all-features
      # keyd's own tests (tests/serve_local.rs) bind a socket through the OS
      # adapter, which `unsupported` refuses, so they run only in the macOS job.
      - name: Check keyd
        working-directory: app/keyd
        run: cargo check --locked

  editor-core:
    name: Editor core (Linux)
    runs-on: ubuntu-latest
    # An uncached run also compiles the wasm-bindgen CLI.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app/editor-core
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: app/package.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      # Caches ~/.cargo/bin too, so the wasm-bindgen CLI installs once.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/editor-core -> target

      - name: Rust is formatted
        run: cargo fmt --all --check
      - name: Clippy, oracle binary and wasm bridge included
        run: |
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo clippy --locked -p oculus-editor-core-wasm --target wasm32-unknown-unknown -- -D warnings
      - name: Unit, property and spec tests
        run: cargo test --locked --workspace
      # The glue generator must be the version wasm/Cargo.toml pins.
      - name: Install the wasm-bindgen CLI
        run: |
          version=$(sed -n 's/^wasm-bindgen = "=\(.*\)"$/\1/p' wasm/Cargo.toml)
          if [ "$(wasm-bindgen --version 2>/dev/null)" != "wasm-bindgen $version" ]; then
            cargo install wasm-bindgen-cli --version "$version" --locked
          fi

      # The oracles import the app's own CodeMirror, Lezer and noteLanguage.
      - name: Install frontend dependencies
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Build the editor core's wasm
        working-directory: app
        run: bun run editor-wasm
      # A new seed each run widens coverage; a failure prints the seed to replay.
      - name: Oracles agree with CodeMirror and Lezer
        working-directory: app
        env:
          SEED: ${{ github.run_number }}
        run: |
          bun editor-core/oracle/text.ts 2000 "$SEED"
          bun editor-core/oracle/changes.ts 5000 "$SEED"
          bun editor-core/oracle/history.ts 1000 "$SEED"
          bun editor-core/oracle/markdown.ts 5000 "$SEED"
          bun editor-core/oracle/shadow.ts 300 "$SEED"

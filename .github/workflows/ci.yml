# Checks every push to master and every pull request on a fresh macOS checkout:
# that the Rust is formatted, the frontend tests and bundle, the Rust tests
# (the app's, keyd's and keyd core's), that keyd builds and signs as the bundle
# ships it, and that the generated CLI reference matches the binary; and on
# Linux, that keyd builds with no OS adapter. See
# docs/development.md#ci-proves-a-fresh-checkout-builds-releases-are-cut-by-hand.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      CARGO_TERM_COLOR: always
      # app/src-tauri/.cargo/config.toml names sccache as rustc's wrapper, so
      # every cargo call fails without it on PATH.
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: app/package.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          # sccache already caches compiled crates; a multi-GB target/ would
          # crowd the repo's cache quota.
          cache-targets: false

      - name: Rust is formatted
        working-directory: app
        run: |
          (cd src-tauri && cargo fmt --check)
          (cd keyd && cargo fmt --check)
          (cd keyd/core && cargo fmt --check)

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Frontend and script tests
        run: bun run test
      - name: Type-check and bundle the frontend
        run: bun run build

      - name: Fetch ffmpeg, build the speech helper and whisper-cli
        run: bun run ffmpeg && bun run speech && bun run whisper
      # keyd's helper app, built for real: the release policy, signed and
      # verified, as the bundle would carry it.
      - name: Build, sign and stage oculus-keyd
        run: bun run stage-keyd
      # tauri-build refuses to compile anything until every externalBin exists;
      # stage-cli is what bootstraps the oculus sidecar on a fresh checkout.
      - name: Build and stage the oculus CLI
        run: bun run stage-cli
      - name: Rust tests
        working-directory: app/src-tauri
        run: cargo test --release --locked
      - name: keyd core tests
        working-directory: app/keyd/core
        run: cargo test --locked --all-features
      - name: keyd tests, release policy and dev
        working-directory: app/keyd
        run: cargo test --locked && cargo test --locked --features dev

      - name: CLI reference matches the binary
        run: |
          bun run docs:cli
          git diff --exit-code -- ../docs/cli-reference.md

  # keyd's core and keyd itself on a target with no adapter: the build
  # proves no OS call has leaked out of app/keyd/core/src/platform/, and
  # core's tests run there over the in-memory endpoint.
  keyd-linux:
    name: keyd seams (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check and test keyd core
        working-directory: app/keyd/core
        run: cargo check --locked --all-features && cargo test --locked --all-features
      # keyd's own tests (tests/serve_local.rs) bind a socket through the OS
      # adapter, which `unsupported` refuses, so they run only in the macOS job.
      - name: Check keyd
        working-directory: app/keyd
        run: cargo check --locked

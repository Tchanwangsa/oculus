[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
# `src/bin/retrieval_smoke.rs` is a second binary, which makes a bare
# `cargo run` (what `tauri dev` issues) ambiguous without this.
default-run = "app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
url = "2"
ureq = { version = "2", features = ["cookies"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# Retrieval reads embedding BLOBs directly. Same sqlx version tauri-plugin-sql
# pulls in, so cargo unifies on one libsqlite3-sys rather than linking two
# copies of SQLite into the binary.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
base64 = "0.22"
half = "2"
# LLM provider API keys live in the macOS keychain, never in SQLite — the
# platform store is an opt-in feature in keyring 3.
keyring = { version = "3", features = ["apple-native"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
scraper = "0.27"
clap = { version = "4", features = ["derive"] }
ego-tree = "0.11"
libc = "0.2.189"
tauri-plugin-notification = "2.3.3"

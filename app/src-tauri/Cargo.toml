[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
# `src/bin/oculus/` is a second binary, which makes a bare `cargo run` (what
# `tauri dev` issues) ambiguous without this. The Tauri bundler copies every
# entry under `src/bin/` into `Contents/MacOS/`, so only shipped bins go there.
default-run = "app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Hashes the renderer's sources into `STUDIO_RENDER_BUILD` (build.rs).
sha2 = "0.10"

[dependencies]
# `unstable` is what enables multiwebview (`Window::add_child`) — every
# in-app browser tab is a child WebView of the main window, see src/shell/browser/mod.rs.
tauri = { version = "2", features = ["protocol-asset", "devtools", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Tauri's own `app_data_dir()` base, so `library::paths::data_dir` is that path with no AppHandle.
dirs = "6"
# keyd's client, its registrar and the one definition of the data dir, plus
# the headless Okta sign-in the app runs when keyd is absent. Never keyd's
# server half (docs/development.md).
keyd_core = { package = "oculus-keyd-core", path = "../keyd/core", features = ["client"] }
# Studio's scene renderer, for `oculus studio` (docs/studio.md).
studio_core = { package = "oculus-studio-core", path = "../studio-core" }
serde = { version = "1", features = ["derive"] }
# `raw_value`: `harness/providers/antigravity/rules.rs` rewrites two lists in agy's
# settings file and hands every other value back verbatim, in file order.
serde_json = { version = "1", features = ["raw_value", "preserve_order", "float_roundtrip"] }
tiny_http = "0.12"
url = "2"
ureq = { version = "2", features = ["cookies"] }
# The rustls and roots ureq already uses, for `parse::mineru::result_tls`.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
# The Ed workspace socket (`sources/ed/live.rs`), over the rustls above: no
# TLS feature of its own.
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# Retrieval reads embedding BLOBs directly. Same sqlx version tauri-plugin-sql
# pulls in, so cargo unifies on one libsqlite3-sys rather than linking two
# copies of SQLite into the binary.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
base64 = "0.22"
half = "2"
# LLM provider API keys live in the macOS keychain, never in SQLite — the
# platform store is an opt-in feature in keyring 3.
keyring = "3"
rpassword = "7"

# `sync` is for the oneshots, watches and semaphores commands await (e.g.
# src/library/pdf_render/render.rs). `time` is the usage ticker's interval
# (src/shell/usage/ticker.rs).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
# The device-sharing server (`src/companion/`, docs/device-sharing.md): hyper's
# HTTP/1 server with upgrades on a private tokio runtime, WebSocket framing
# over the upgraded socket, the listeners' socket options and this Mac's
# addresses. All already in the lock tree.
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = { version = "0.1", default-features = false }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
socket2 = { version = "0.6", default-features = false }
bytes = { version = "1", default-features = false, features = ["std"] }
if-addrs = { version = "0.15", default-features = false }
# Local time for the usage table's hour keys.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
scraper = "0.27"
# wrap_help so `--help` and the generated agents/OCULUS-CLI.md wrap to a width
# instead of emitting one very long line per option.
clap = { version = "4", features = ["derive", "wrap_help"] }
ego-tree = "0.11"
libc = "0.2.189"
# `oculus grep` searches PDF page text, which lives only in the database —
# ripgrep over the library on disk cannot see it. Already in the lock tree.
regex = "1"
ring = "0.17"

# The MinerU cloud client, ported from the Python sidecar (see src/parse/).
# `zip` reads the result archive, and `imagesize` replaces PIL's one use:
# reading a crop's dimensions from its header to drop template furniture.
zip = { version = "2", default-features = false, features = ["deflate"] }
imagesize = "0.13"
# Every PDF raster, page count and page box (`src/library/pdf_render/`), and
# the viewer's text and links (`src/library/pdf_view/`): pure Rust, so no
# native library. Re-exports hayro-interpret/-syntax. Pinned to one upstream
# commit after 0.8.0 for its soft-mask fix (#1394, Figma exports); back to
# crates.io once a release carries it.
hayro = { git = "https://github.com/LaurenzV/hayro", rev = "9016f891986f290b9bc00dabf3e5e572c6e1cdb2" }
image = { version = "0.25", default-features = false, features = ["png"] }
# Spreadsheets (xlsx/xlsm/xls/ods) become markdown text in-process
# (`src/pages/sheets/`); no LibreOffice, no parse service, no embedding.
calamine = "0.36"
# Spotify Connect playback (`src/music/`, docs/music.md). librespot's dev
# branch by rev, not crates.io 0.8.0: Spotify's endpoint changes land there
# first. Bump the rev by hand; never `cargo update` them. librespot-connect
# is patched to a vendored copy (`[patch]` below).
librespot-core = { git = "https://github.com/librespot-org/librespot", rev = "4a005903e078d512456fb008aaa9ba6246881bd9" }
librespot-connect = { git = "https://github.com/librespot-org/librespot", rev = "4a005903e078d512456fb008aaa9ba6246881bd9" }
librespot-metadata = { git = "https://github.com/librespot-org/librespot", rev = "4a005903e078d512456fb008aaa9ba6246881bd9" }
librespot-playback = { git = "https://github.com/librespot-org/librespot", rev = "4a005903e078d512456fb008aaa9ba6246881bd9" }
# `AuthenticationType`, which librespot-core keeps private, and the playlist4
# and Connect messages `src/music/` reads.
librespot-protocol = { git = "https://github.com/librespot-org/librespot", rev = "4a005903e078d512456fb008aaa9ba6246881bd9" }
# Decodes those messages (`src/music/library/rootlist.rs`); the version
# librespot-protocol is generated for.
protobuf = "3.7"
# The Spotify login: the same oauth2 librespot-oauth builds on, used directly
# because librespot's client opens the browser itself and hides the URL.
oauth2 = { version = "5", default-features = false, features = ["reqwest", "reqwest-blocking"] }
# librespot reports a track it cannot decrypt only as a log line
# (`src/music/logs.rs`).
log = { version = "0.4", features = ["std"] }
# The music output picker and its sink (`src/music/audio/`): the same cpal
# and rodio librespot-playback's rodio backend builds on, at its versions.
cpal = "0.16"
rodio = { version = "0.21", default-features = false, features = ["playback"] }
# Reads librespot's dealer stream of Connect cluster updates
# (`src/music/devices.rs`) and fetches playlist headers four at a time
# (`src/music/library/mod.rs`); `sink` sends the companion's WebSocket frames.
futures-util = { version = "0.3", default-features = false, features = ["alloc", "sink"] }
# ONNX Runtime for Studio's narration aligner (`src/runtime/onnx/`,
# `src/studio/timing/`). Links ORT 1.28 statically on macOS arm64, fetched by
# ort-sys's build script; pinned exactly because rc releases change the API.
ort = "=2.0.0-rc.13"
# Narration clips in (`src/studio/audio/`): hound reads the TTS server's WAV,
# rubato resamples it to the aligner's 16 kHz. rubato's API changes between
# majors and this one is new, so it is pinned exactly.
hound = "3.5.1"
rubato = "=5.0.1"
# Verifies a downloaded model against its pinned checksum (`src/runtime/onnx/pack/`).
# Already in the lock tree.
sha2 = "0.10"
# The G2P guesser's NFKD and combining-mark stripping (`src/studio/voice/g2p/guess/`).
# Already in the lock tree.
unicode-normalization = "0.1.25"
# The process's one address observer (`src/runtime/network/`), which music's
# reconnects and device sharing's links follow: if-watch over netwatcher because on macOS it
# builds on the system-configuration already in the lock (SCDynamicStore),
# with the same address-change stream on Windows and Linux.
if-watch = { version = "3.2.2", features = ["tokio"] }

# The in-app browser seeds WebKit's cookie jar with the Canvas session (see
# `seed_sessions` in src/shell/browser/seed.rs). WebKit cookie ordering uses
# WKHTTPCookieStore directly; Windows uses Tauri cookie APIs. These are the same crates wry
# already builds on.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
block2 = "0.6"
objc2 = "0.6"
# `NSBundle`, `NSProcessInfo` and `NSData` name WebKit's application and hand
# it the WebCrypto master key (`src/shell/webcrypto/`).
objc2-foundation = { version = "0.3", features = ["NSArray", "NSBundle", "NSData", "NSDictionary", "NSHTTPCookie", "NSProcessInfo", "NSString", "NSURL"] }
# A local key-down monitor gives a focused browser page ⌘-keys before the
# menu, and Undo/Redo/Select All reach it as AppKit actions (see `src/shell/keys.rs`).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSApplication", "NSEvent", "NSResponder", "NSWindow"] }
# `WKWebView` and the two `WKFind*` types are the browser toolbar's: the
# back/forward list and find-in-page have no Tauri API, so they are read
# and driven on the WKWebView directly (see `src/shell/browser/page.rs`).
objc2-web-kit = { version = "0.3", features = ["block2", "WKHTTPCookieStore", "WKWebsiteDataStore", "WKWebView", "WKNavigation", "WKFindConfiguration", "WKFindResult", "WKScriptMessage", "WKScriptMessageHandler", "WKUserContentController"] }

[dev-dependencies]
# Writes the synthetic PDFs the tests parse and rasterise.
lopdf = { version = "0.34", default-features = false, features = ["nom_parser"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
dunce = "1"
junction = "1"
webview2-com = "0.38.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }

[target.'cfg(windows)'.dev-dependencies]
# Enables explicitly registered in-process fake brokers in Windows release tests.
keyd_core = { package = "oculus-keyd-core", path = "../keyd/core", features = ["test-support"] }

# The manifest profile applies to the app and CLI from every working directory.
[profile.dev]
# Limited debug info (no variables) is enough for backtraces and links faster.
debug = 1

[profile.dev.package."*"]
# Dependencies optimised once and cached; our own crate stays unoptimised so
# incremental rebuilds stay quick.
opt-level = 3
debug = false

# librespot-connect with Spirc::skip_to and Spirc::remove_next, which act on
# the Spirc's own queue (`vendor/librespot-connect`, docs/music-library.md).
# Bump it with the other librespot crates' rev.
[patch."https://github.com/librespot-org/librespot"]
librespot-connect = { path = "vendor/librespot-connect" }

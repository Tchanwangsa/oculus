[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
# `src/bin/oculus/` is a second binary, which makes a bare `cargo run` (what
# `tauri dev` issues) ambiguous without this. The Tauri bundler copies every
# entry under `src/bin/` into `Contents/MacOS/`, so only shipped bins go there.
default-run = "app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Lets a release build find libpdfium through `OCULUS_PDFIUM_LIB`, an ancestor
# `binaries/`, the build tree and the system, as a debug build does. Only
# `bun run cli` sets it; a bundle's CLI must not (docs/development.md).
dev-pdfium = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` is what enables multiwebview (`Window::add_child`) — every
# in-app browser tab is a child WebView of the main window, see src/browser.rs.
tauri = { version = "2", features = ["protocol-asset", "devtools", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Tauri's own `app_data_dir()` base, so `paths::data_dir` is that path with no AppHandle.
dirs = "6"
# keyd's client, its registrar and the one definition of the data dir, plus
# the headless Okta sign-in the app runs when keyd is absent. Never keyd's
# server half (docs/development.md).
keyd_core = { package = "oculus-keyd-core", path = "../keyd/core", features = ["client"] }
serde = { version = "1", features = ["derive"] }
# `raw_value`: `harness/antigravity_rules.rs` rewrites two lists in agy's
# settings file and hands every other value back verbatim, in file order.
serde_json = { version = "1", features = ["raw_value"] }
tiny_http = "0.12"
url = "2"
ureq = { version = "2", features = ["cookies"] }
# The rustls and roots ureq already uses, for `parse::mineru::result_tls`.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# Retrieval reads embedding BLOBs directly. Same sqlx version tauri-plugin-sql
# pulls in, so cargo unifies on one libsqlite3-sys rather than linking two
# copies of SQLite into the binary.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
base64 = "0.22"
half = "2"
# LLM provider API keys live in the macOS keychain, never in SQLite — the
# platform store is an opt-in feature in keyring 3.
keyring = { version = "3", features = ["apple-native"] }

# `sync` is the browser's: a WKWebView snapshot answers on a completion
# block, and the command awaits a oneshot for it (see src/browser.rs). `time`
# is the usage ticker's interval (src/usage.rs).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
# Local time for the usage table's hour keys; already built for pdfium-render.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
scraper = "0.27"
# wrap_help so `--help` and the generated agents/OCULUS-CLI.md wrap to a width
# instead of emitting one very long line per option.
clap = { version = "4", features = ["derive", "wrap_help"] }
ego-tree = "0.11"
libc = "0.2.189"
# `oculus grep` searches PDF page text, which lives only in the database —
# ripgrep over the library on disk cannot see it. Already in the lock tree.
regex = "1"

# The MinerU cloud client, ported from the Python sidecar (see src/parse/).
# `zip` reads the result archive, `lopdf` counts pages so a document can be
# split into MinerU's 200-page tasks, and `imagesize` replaces PIL's one use:
# reading a crop's dimensions from its header to drop template furniture.
zip = { version = "2", default-features = false, features = ["deflate"] }
lopdf = { version = "0.34", default-features = false, features = ["nom_parser"] }
imagesize = "0.13"
pdfium-render = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
# Spreadsheets (xlsx/xlsm/xls/ods) become markdown text in-process
# (`src/sheets.rs`); no LibreOffice, no parse service, no embedding.
calamine = "0.36"

# The in-app browser seeds WebKit's cookie jar with the Canvas session (see
# `seed_canvas_session` in src/browser.rs) — Tauri exposes no cookie setter, so
# that goes through WKHTTPCookieStore directly. These are the same crates wry
# already builds on.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSDictionary", "NSHTTPCookie", "NSString"] }
# A local key-down monitor gives a focused browser page ⌘-keys before the
# menu, and Undo/Redo/Select All reach it as AppKit actions (see `src/keys.rs`).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSApplication", "NSEvent", "NSResponder", "NSWindow"] }
# `WKWebView` and the two `WKFind*` types are the browser toolbar's: the
# back/forward list and find-in-page have no Tauri API, so they are read
# and driven on the WKWebView directly (see `src/browser.rs`).
objc2-web-kit = { version = "0.3", features = ["block2", "WKHTTPCookieStore", "WKWebsiteDataStore", "WKWebView", "WKNavigation", "WKFindConfiguration", "WKFindResult"] }

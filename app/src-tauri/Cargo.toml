[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
# `src/bin/retrieval_smoke.rs` is a second binary, which makes a bare
# `cargo run` (what `tauri dev` issues) ambiguous without this.
default-run = "app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` is what enables multiwebview (`Window::add_child`) — every
# in-app browser tab is a child WebView of the main window, see src/browser.rs.
tauri = { version = "2", features = ["protocol-asset", "devtools", "unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
url = "2"
ureq = { version = "2", features = ["cookies"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# Retrieval reads embedding BLOBs directly. Same sqlx version tauri-plugin-sql
# pulls in, so cargo unifies on one libsqlite3-sys rather than linking two
# copies of SQLite into the binary.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
base64 = "0.22"
half = "2"
# LLM provider API keys live in the macOS keychain, never in SQLite — the
# platform store is an opt-in feature in keyring 3.
keyring = { version = "3", features = ["apple-native"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
scraper = "0.27"
# wrap_help so `--help` and the generated agents/OCULUS-CLI.md wrap to a width
# instead of emitting one very long line per option.
clap = { version = "4", features = ["derive", "wrap_help"] }
ego-tree = "0.11"
libc = "0.2.189"
# `oculus grep` searches PDF page text, which lives only in the database —
# ripgrep over the library on disk cannot see it. Already in the lock tree.
regex = "1"

# The MinerU cloud client, ported from the Python sidecar (see src/parse/).
# `zip` reads the result archive, `lopdf` counts pages so a document can be
# split into MinerU's 200-page tasks, and `imagesize` replaces PIL's one use:
# reading a crop's dimensions from its header to drop template furniture.
zip = { version = "2", default-features = false, features = ["deflate"] }
lopdf = { version = "0.34", default-features = false, features = ["nom_parser"] }
imagesize = "0.13"

# The in-app browser seeds WebKit's cookie jar with the Canvas session (see
# `seed_canvas_session` in src/browser.rs) — Tauri exposes no cookie setter, so
# that goes through WKHTTPCookieStore directly. These are the same crates wry
# already builds on.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSDictionary", "NSHTTPCookie", "NSString"] }
objc2-web-kit = { version = "0.3", features = ["block2", "WKHTTPCookieStore", "WKWebsiteDataStore"] }

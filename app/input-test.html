<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Oculus · Input test</title>
    <style>
      :root { font: 17px/1.5 system-ui, sans-serif; color-scheme: light dark; color: CanvasText; background: Canvas; }
      body { max-width: 960px; margin: auto; padding: 20px; }
      h1 { font-size: 26px; margin: 0; }
      p { margin: 10px 0; }
      .controls { display: flex; flex-wrap: wrap; gap: 12px; margin: 18px 0; }
      button { font: inherit; padding: 10px 18px; }
      canvas { display: block; width: 100%; height: 55dvh; border: 1px solid GrayText; border-radius: 12px; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      output { display: block; margin-top: 12px; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <h1>Input test</h1>
    <p>Write here and tap Test button for a minute or two. If input stops, note the time.</p>
    <p>This is a temporary drawing pad. Keep your notebook open in its original tab.</p>
    <p id="logging" role="status">Connecting to local logging…</p>
    <div class="controls">
      <button id="test" type="button">Test button · 0 taps</button>
      <button id="clear" type="button">Clear test drawing</button>
    </div>
    <canvas aria-label="Input test drawing pad"></canvas>
    <output id="counts" aria-live="off">Pointer contacts: 0 · Touch contacts: 0</output>
    <script type="module" src="/src/companion/diagnostics/inputTest.ts"></script>
  </body>
</html>

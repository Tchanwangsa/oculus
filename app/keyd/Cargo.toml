[package]
name = "oculus-keyd"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

# Standalone, and never a member of any workspace: a shared Cargo.lock bump
# would relink keyd, change its cdhash and bring back the keychain prompt
# (docs/development.md). `vault` sits inside this root because cargo hashes a
# path dependency outside it by absolute path, which would give each checkout
# different bytes. Excluded, because it is a root of its own for its tests.
[workspace]
exclude = ["vault"]

[[bin]]
name = "oculus-keyd"
path = "src/main.rs"

[features]
# Admit any caller running as this user instead of requiring one inside
# keyd's own app bundle. `bun run keyd` builds with it; a bundled release
# must not.
dev = []

[dependencies]
vault = { package = "oculus-vault", path = "vault" }
libc = "=0.2.190"
core-foundation = "=0.10.1"
core-foundation-sys = "=0.8.7"
serde_json = "=1.0.151"

[build-dependencies]
sha2 = "=0.10.9"


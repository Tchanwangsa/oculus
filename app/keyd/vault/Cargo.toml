[package]
name = "oculus-vault"
version = "0.1.0"
edition = "2021"
publish = false

# Its own root, so `cargo test` here never resolves into keyd's lock. keyd
# links it by path: an edit here is a keyd source change (docs/development.md).
[workspace]

[lib]
name = "vault"

[dependencies]
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
getrandom = "=0.2.17"
libc = "=0.2.190"
serde_json = "=1.0.151"

# The master key's keychain item. security-framework directly, not keyring,
# because keyring cannot set the item's label, which the prompt shows.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
security-framework = "=3.7.0"

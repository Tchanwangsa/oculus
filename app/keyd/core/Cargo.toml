[package]
name = "oculus-keyd-core"
version = "0.1.0"
edition = "2021"
publish = false

# Its own root, so `cargo test` here never resolves into keyd's lock. keyd
# links it by path: an edit here is a keyd source change (docs/development.md).
[workspace]

[lib]
name = "keyd_core"

[features]
# keyd's half: the vault, the ops, `forward`, the server loop, and the OS
# secret store behind them.
server = ["dep:chacha20poly1305", "dep:getrandom", "dep:ureq", "dep:core-foundation", "dep:core-foundation-sys", "dep:security-framework"]
# The app's and CLI's half: the client and the registrar.
client = []

[dependencies]
# The one definition of the data dir, the same base Tauri's `app_data_dir()` uses.
dirs = "=6.0.0"
serde_json = "=1.0.151"
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"], optional = true }
getrandom = { version = "=0.2.17", optional = true }
# `forward`'s HTTPS client: rustls with the webpki roots (`tls`), and no
# `gzip`, so the answer's bytes pass through as the origin sent them. Never
# `proxy-from-env`: an environment variable must not move where a key goes.
ureq = { version = "=2.12.1", default-features = false, features = ["tls"], optional = true }

# The POSIX file helpers (`platform/unix.rs`).
[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

# The macOS adapter's caller check and keychain. security-framework directly,
# not keyring, because keyring cannot set the item's label, which the prompt
# shows.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { version = "=0.10.1", optional = true }
core-foundation-sys = { version = "=0.8.7", optional = true }
security-framework = { version = "=3.7.0", optional = true }
